default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DEV_DB_NAME", "stageup_development") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5439") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "stageup_test") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5439") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

production:
<% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
<% else %>
  adapter: sqlite3
  database: /tmp/production.sqlite3
  pool: 5
  timeout: 5000
<% end %>
